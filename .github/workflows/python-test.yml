name: Python Tests and Linting

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.9, 3.10]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-pydocstyle
        pip install -r requirements.txt

    - name: Run tests
      run: pytest tests/

    - name: Check docstrings
      run: pytest tests/test_docstrings.py

    - name: Lint with flake8
      run: flake8 acsefunctions tests

  validate-environment:
    name: Validate Environment Files
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: 3.9

    - name: Create environment from environment.yml
      run: conda env create -f environment.yml

    - name: Check environment consistency
      run: conda env export --no-builds | diff - environment.yml || exit 1

    - name: Validate requirements.txt
      run: pip install -r requirements.txt