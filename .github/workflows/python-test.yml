name: Python Tests and Linting

on:
  push:
    branches: 
      - master
      - dev
  pull_request:
    branches: 
      - master
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.9, 3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-pydocstyle
        pip install -r requirements.txt

    - name: Install acsefunctions package
      run: pip install -e .

    - name: Run tests
      run: pytest tests/

    - name: Check docstrings
      run: pytest tests/test_docstrings.py

    - name: Lint with flake8
      run: flake8 acsefunctions tests

  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: 3.12

    - name: Create environment from environment.yml
      run: conda env create -f environment.yml

    - name: Activate the environment
      shell: bash -l {0}
      run: conda activate acsefunctions

    - name: Verify environment packages
      shell: bash -l {0}
      run: |
        conda list numpy || exit 1
        conda list pytest || exit 1
        conda list flake8 || exit 1