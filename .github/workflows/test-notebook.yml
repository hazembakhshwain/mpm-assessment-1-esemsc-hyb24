name: Test Jupyter Notebook

on:
  push:
    branches:
      - master  # Adjust if you use a different branch (e.g., main)
  pull_request:
    branches:
      - master

jobs:
  test-notebook:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'  # Adjust the version to match your environment

    # Step 3: Install dependencies from the environment.yml file (or requirements.txt)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbconvert jupyter
        pip install -r requirements.txt

    # Step 4: Run the notebook
    - name: Execute Jupyter Notebook
      run: |
        jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1200 documentaion.ipynb

    # Step 5: Ensure that the notebook runs successfully
    - name: Verify notebook execution
      run: |
        echo "Notebook executed successfully"