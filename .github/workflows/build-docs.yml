name: Build and Commit Sphinx Documentation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme

    - name: Install LaTeX and latexmk
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk
        sudo apt-get install -y texlive-full  # Ensure full LaTeX support

    - name: Build Sphinx HTML documentation
      run: |
        cd docs
        make html

    - name: Build Sphinx PDF documentation
      run: |
        cd docs
        mkdir -p build/latex
        make latexpdf

    - name: Commit and push documentation changes
      if: ${{ github.ref == 'refs/heads/master' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add docs/build/html docs/build/latex/ACSEFunctions.pdf
        git commit -m "Auto-update Sphinx documentation including PDF"
        git push origin master